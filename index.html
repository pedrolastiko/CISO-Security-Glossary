            { name: "DSPM (Data Security Posture Management)", category: "identify", maturity: "trending", description: "Data security posture management - Find, classify and protect cloud data", longDescription: "Data Security Posture Management discovers where sensitive data resides across cloud and SaaS estates, classifies it, maps who can access it, and prioritizes remediation of exposure, answering the question of what data an organization holds and how it is protected rather than merely which infrastructure is misconfigured. The need arises from cloud data sprawl, where analytics pipelines, developer copies, backups, snapshots, logs, and machine learning datasets replicate regulated information into stores nobody has inventoried, so a database hardened at source is undermined by an unmonitored copy in a test bucket. DSPM tools connect to cloud accounts and data platforms through agentless APIs, scan structured and unstructured stores, apply classification to identify personal, financial, health, and secret material, then build a data map correlating sensitivity with location, encryption state, public exposure, and effective access paths from identities and applications. Prioritization derives from the combination of these factors, elevating a publicly reachable store of regulated records above an encrypted internal one. Outputs support data minimization by revealing stale duplicates for deletion, subject access and erasure requests by locating all copies of an individual record, residency verification for sovereignty obligations, and blast radius assessment during incidents. DSPM increasingly converges with cloud posture platforms so data sensitivity contextualizes every infrastructure finding.", technologies: ["Cyera", "Varonis", "Sentra", "Wiz DSPM"] },
            { name: "eBPF Runtime Security", category: "detect", maturity: "trending", description: "eBPF runtime security - Kernel-level observability without modules", longDescription: "Extended Berkeley Packet Filter technology allows verified programs to run inside the Linux kernel, attaching to system calls, network events, and function entry points to observe and enforce behavior without kernel modules or code changes. For security this delivers deep runtime visibility with low overhead and without the stability risk historically associated with kernel drivers, since eBPF programs pass a verifier proving memory safety and bounded execution before loading. Applied to workload protection, eBPF sensors capture process execution, file access, network connections, privilege changes, and container boundary events, producing telemetry that identifies container escape attempts, reverse shells, cryptominers, unexpected outbound connections, and modification of sensitive binaries in real time. Because instrumentation sits in the kernel, a single sensor per node observes every container without per-container agents, which suits ephemeral and serverless workloads where installing agents is impractical. Beyond detection, eBPF underpins identity-aware network policy and transparent encryption in service mesh implementations, and enforcement modes can terminate offending processes or drop connections inline. Considerations include kernel version dependencies affecting available hooks, portability work through compile-once run-everywhere tooling, restricted capability in managed environments that block privileged sensors, and the need to tune collection scope since unfiltered syscall capture generates substantial data volume.", technologies: ["Cilium Tetragon", "Falco", "Sysdig", "Pixie"] },
            { name: "EDR (Endpoint Detection and Response)", category: "detect", maturity: "mature", description: "Endpoint detection and response - Workstation protection", longDescription: "Endpoint Detection and Response provides continuous monitoring and investigation of endpoint activities to detect and respond to cyber threats targeting workstations, servers, and mobile devices. Unlike traditional antivirus focusing on known malware signatures, EDR monitors behavioral indicators of compromise, detects fileless attacks, identifies lateral movement, and enables rapid incident response. EDR agents collect telemetry including process execution, network connections, file modifications, registry changes, and user activities, sending data to centralized analysis platforms. Machine learning and behavioral analytics detect suspicious patterns suggesting malware, exploit attempts, or attacker activities. When threats are identified, EDR enables remote investigation, evidence collection, containment through network isolation, and remediation through process termination or file quarantine. Security teams use EDR for threat hunting, incident investigation, and automated response. As attacks grow sophisticated and evade prevention, EDR provides critical visibility and response capabilities for detecting breaches, understanding attacker techniques, containing threats, and minimizing impact through rapid response.", technologies: ["CrowdStrike Falcon", "Microsoft Defender", "Carbon Black", "SentinelOne", "Cybereason"] },
            { name: "eiDAS", category: "protect", maturity: "mature", description: "Electronic Identification Authentication - EU eIDAS regulation", longDescription: "The eIDAS (electronic IDentification, Authentication and trust Services) Regulation establishes EU-wide framework for electronic identification and trust services, enabling secure cross-border electronic transactions and mutual recognition of electronic identification schemes. eIDAS defines assurance levels for electronic identification (low, substantial, high), establishes requirements for qualified trust service providers offering services like electronic signatures, seals, time stamps, and website authentication, and mandates cross-border recognition of notified electronic identification schemes. Organizations providing regulated trust services must obtain qualified trust service provider status, implement security requirements, undergo audits, and ensure interoperability. eIDAS enables EU citizens to use national electronic IDs across borders, establishes legal framework for electronic signatures equivalent to handwritten signatures, and supports digital transformation of government and business services. As organizations digitize transactions requiring strong authentication and non-repudiation, eIDAS provides legal and technical framework enabling trusted electronic interactions across EU member states while harmonizing previously fragmented national approaches to electronic identification and trust services.", technologies: ["Sector", "Thales", "Gemalto", "Safenet"] },
            { name: "Email Security & DMARC/BIMI", category: "protect", maturity: "mature", description: "Email security - Anti-phishing, authentication and domain protection", longDescription: "Email remains the dominant initial access vector, making layered email security and sender authentication foundational controls. Domain authentication rests on three complementary standards, with SPF declaring which hosts may send for a domain, DKIM cryptographically signing messages so recipients can verify integrity and origin, and DMARC binding the two to a published policy instructing receivers to quarantine or reject unauthenticated mail while returning aggregate and forensic reports. Reaching a DMARC reject policy requires disciplined inventory of legitimate sending services, since misconfiguration silently blocks business mail, and BIMI builds on enforced DMARC by displaying a verified brand logo, adding recognizable trust signals and requiring a verified mark certificate. Beyond authentication, protection platforms apply reputation analysis, URL rewriting and detonation, attachment sandboxing, and increasingly behavioral models that baseline normal correspondence patterns to detect business email compromise, vendor impersonation, and payment fraud carrying no malicious payload. Post-delivery remediation retracts messages weaponized after arrival, while integration with identity telemetry links suspicious mail to account compromise. Large mailbox providers now mandate authentication for bulk senders, moving DMARC enforcement from a security preference to a deliverability requirement, and lookalike domain monitoring extends defence to infrastructure the organization does not control.", technologies: ["Proofpoint", "Abnormal Security", "Valimail", "Mimecast"] },
            { name: "EUCS (EU Cloud Cybersecurity Certification)", category: "govern", maturity: "emerging", description: "EUCS - European cloud security certification scheme", longDescription: "The EU Cybersecurity Certification Scheme for Cloud Services (EUCS), developed by ENISA under the EU Cybersecurity Act, establishes a common certification framework for cloud security across the European Union. The scheme defines three assurance levels — Basic, Substantial, and High — with the High level being particularly significant for sovereign cloud requirements, as it addresses EU data sovereignty concerns by limiting market access to cloud providers not subject to conflicting foreign laws such as the US CLOUD Act. Organizations deploying sensitive or critical data in cloud environments can use EUCS-certified services with confidence in their security and sovereignty properties. Public sector organizations, critical infrastructure operators, and entities handling sensitive EU data increasingly require EUCS-High certified cloud services to meet regulatory obligations under NIS2, DORA, and sector-specific regulations. The scheme provides a unified approach replacing fragmented national certification schemes such as France's SecNumCloud and Germany's BSI C5, while harmonizing sovereignty requirements across member states. Cloud providers pursuing EUCS certification must implement comprehensive technical and organizational security measures, undergo third-party audits by accredited certification bodies, and demonstrate compliance with European sovereignty requirements at the claimed assurance level.", technologies: ["ENISA", "OVHcloud", "BSI", "TÜV Rheinland"] },
            { name: "EUDI Wallet (EU Digital Identity Wallet)", category: "protect", maturity: "emerging", description: "EUDI Wallet - European sovereign digital identity framework", longDescription: "The EU Digital Identity Wallet, established under the revised eIDAS 2.0 regulation, provides every EU citizen and resident with a standardized digital identity wallet enabling secure authentication and credential sharing across all EU member states. These wallets store qualified digital credentials including national IDs, driving licenses, educational certificates, professional qualifications, and health data, presenting them selectively to service providers without revealing unnecessary information. The EUDI framework implements self-sovereign identity principles allowing users to control exactly which attributes they share, preventing over-collection of personal information. Qualified Electronic Attestation of Attributes provides legally recognized digital credentials equivalent to physical documents. Member states must offer wallets to citizens, while large online platforms and public services must accept them for authentication. The EUDI Wallet enables seamless digital authentication across Europe, reduces reliance on private identity providers such as US-based social login services, provides privacy-preserving selective disclosure, and establishes Europe's sovereign digital identity infrastructure independent of foreign technology gatekeepers. Implementation requires significant investment in PKI infrastructure, wallet application development, cross-border interoperability standards, and integration with national identity schemes across 27 member states.", technologies: ["IDnow", "Thales", "ENISA", "BSI"] },
            { name: "Extended enterprise IAM", category: "protect", maturity: "mature", description: "Extended enterprise IAM - Partner/external identity management", longDescription: "Extended Enterprise IAM manages identities and access for partners, suppliers, contractors, and other external entities that require access to organizational resources. This extends traditional workforce IAM beyond employees to the extended business ecosystem while maintaining appropriate security controls and audit trails. Solutions provide partner onboarding workflows, federated authentication with external identity providers, granular access controls limiting partners to authorized resources, just-in-time access provisioning, and visibility into external user activities. Organizations must balance security with partner experience, ensuring external access is secure and compliant while not creating friction that impedes business relationships. Implementation challenges include diverse partner technical capabilities, various authentication methods, complex access requirements, and maintaining security without requiring partners to adopt specific identity technologies. As organizations increasingly collaborate through digital channels and integrate supply chains, extended enterprise IAM enables secure, scalable partner access management.", technologies: ["Okta", "Auth0", "Azure AD B2B", "Ping Identity"] },
            { name: "Extended tier 0", category: "protect", maturity: "trending", description: "Extended tier 0 - Extended privileged governance to OT/Cloud", longDescription: "Extended Tier 0 expands privileged access governance beyond traditional IT infrastructure to include cloud platforms, operational technology, and other critical systems requiring the highest level of protection. Tier 0 represents the most privileged level in security architectures, including domain controllers, identity systems, and administrative accounts that control the entire environment. Extension recognizes that cloud administrative accounts, OT engineering workstations, and DevOps platforms now have equivalent privilege requiring similar protection. Organizations must identify all Tier 0 equivalent systems across hybrid environments, implement consistent privileged access controls, enforce strong authentication, monitor privileged activities, and prevent privilege escalation paths from lower tiers. This holistic approach to privileged access prevents attackers from exploiting gaps between traditional IT PAM and modern cloud or OT environments.", technologies: ["CyberArk", "Delinea", "BeyondTrust", "HashiCorp"] },
            { name: "Fast IS rebuilding", category: "recover", maturity: "trending", description: "Fast IT infrastructure rebuilding - Accelerated recovery", longDescription: "Fast IT infrastructure rebuilding enables rapid recovery from major incidents through pre-configured recovery procedures, automated rebuilding processes, infrastructure-as-code templates, and tested runbooks. This capability reduces recovery time from days to hours by automating system provisioning, configuration, and validation. Organizations maintain infrastructure definitions, automated deployment pipelines, backup configurations, and recovery procedures that can quickly recreate environments. This is critical for recovering from ransomware, infrastructure failures, or disasters, enabling business continuity through rapid system restoration.", technologies: ["VMware Site Recovery", "AWS DRS", "Zerto", "IBM Spectrum"] },
            { name: "Fusion centers (IT/OT/Fraud)", category: "detect", maturity: "trending", description: "Fusion centers - Integration of operations", longDescription: "Security Fusion Centers integrate previously siloed security operations for IT, operational technology, and fraud detection into unified operations enabling coordinated threat response. These centers break down organizational silos by combining security operations center (SOC), OT security monitoring, and fraud detection teams with shared platforms, processes, and threat intelligence. Correlation across these domains detects sophisticated attacks spanning multiple areas, enables coordinated response, shares intelligence, and provides comprehensive organizational security visibility. Fusion centers recognize that modern attacks don't respect organizational boundaries between IT, OT, and fraud teams.", technologies: ["Splunk Fusion", "ServiceNow", "Fortinet FortiSOC", "Elastic Fusion"] },
            { name: "GAIA-X", category: "govern", maturity: "emerging", description: "GAIA-X - European federated cloud and data sovereignty initiative", longDescription: "GAIA-X is a European initiative building an open, federated, and secure data infrastructure based on European values of data protection, transparency, and digital sovereignty. Launched in 2020 by Germany and France and now involving over 300 member organizations, GAIA-X establishes standards, rules, and a governance framework enabling interoperable cloud and data services that give users genuine control over their data. The initiative defines a trust framework with requirements for cloud and data services including transparency, data portability, operational security, and sovereignty compliance. GAIA-X does not build cloud infrastructure itself but defines standards that certified providers must meet, enabling a federated ecosystem where organizations can choose services from multiple European providers while ensuring interoperability and sovereignty. Use cases include sovereign health data spaces, automotive data sharing, energy sector data exchange, and financial services data collaboration. GAIA-X represents Europe's strategic response to dependence on US hyperscalers by creating a European alternative ecosystem with embedded sovereignty and privacy protections aligned with GDPR, NIS2, and EU digital sovereignty objectives. The initiative complements other EU sovereignty instruments including the Data Act, EUCS certification scheme, and Digital Markets Act.", technologies: ["GAIA-X", "OVHcloud", "Scaleway", "T-Systems"] },
            { name: "Global maturity framework", category: "govern", maturity: "mature", description: "Global maturity framework - Maturity assessment framework", technologies: ["NIST", "ISO 27001", "COBIT", "ITIL"] },
            { name: "Harvest Now, Decrypt Later (HNDL)", category: "identify", maturity: "trending", description: "HNDL - Retrospective decryption risk from quantum computing", longDescription: "Harvest Now, Decrypt Later describes the threat model in which an adversary collects and stores encrypted traffic and data today with the intention of decrypting it once a cryptographically relevant quantum computer becomes available. The reasoning is straightforward, since storage is inexpensive while the classical cryptography protecting data in transit and at rest, principally RSA and elliptic curve key exchange, would be broken by Shor algorithm on sufficiently capable quantum hardware, retroactively exposing everything captured in the interim. This inverts the usual risk calculus, because the exposure date is not the breach date, and the relevant question becomes how long a given secret must remain confidential rather than when quantum computers will arrive. The Mosca inequality formalizes the assessment, holding that action is required when the time data must stay secret plus the time needed to migrate systems exceeds the time until quantum capability. Data with long confidentiality lifetimes is therefore already at risk, including state and diplomatic communications, defence and intelligence material, intellectual property and research, health records, genomic data, long-term financial and legal records, and the root keys and certificate authorities underpinning trust infrastructure. Nation-state interception at scale makes collection plausible for high-value targets today. The practical implication is that migration prioritization should be driven by confidentiality lifetime rather than by system criticality alone.", technologies: ["SandboxAQ", "Quantum Xchange", "Palo Alto Networks", "Thales"] },
            { name: "Help-desk Social Engineering", category: "protect", maturity: "trending", description: "Help-desk social engineering - Identity verification at the service desk", longDescription: "Help-desk social engineering exploits the account recovery process rather than technical controls, targeting the human decision point where a caller claiming to be an employee requests a password reset or the registration of a new multi-factor device. The technique has produced some of the most damaging intrusions of recent years, with financially motivated groups using fluent native-language callers, information gathered from social media and previous breaches, and pretexts involving urgency or authority to convince service desk staff to reset credentials or enrol an attacker-controlled authenticator. Once a factor is registered, every downstream control treats the attacker as the legitimate user. The vulnerability is structural, since service desks are measured on resolution speed and customer satisfaction, staff are often outsourced with limited context, and verification traditionally relies on knowledge-based questions whose answers are readily available or already breached. Effective countermeasures replace knowledge with cryptographic or documented verification, including identity proofing against a government document with liveness detection, verification through a pre-enrolled trusted device, callback to a manager or verified channel, in-person or video verification for privileged accounts, and self-service recovery that removes human discretion entirely. Supporting measures include mandatory delays and secondary approval for factor registration, alerting the account holder through independent channels, session recording of recovery calls, and regular social engineering testing of the desk itself.", technologies: ["Nametag", "HYPR Affirm", "Okta Verify", "IDnow"] },
            { name: "Homomorphic encryption", category: "protect", maturity: "emerging", description: "Homomorphic encryption - Computation on encrypted data", technologies: ["Microsoft SEAL", "Zama", "Duality", "IBM HElib"] },
            { name: "Hybrid PQC TLS (ML-KEM)", category: "protect", maturity: "trending", description: "Hybrid post-quantum TLS - ML-KEM key exchange in transit encryption", longDescription: "Hybrid post-quantum TLS combines a classical key exchange with a post-quantum key encapsulation mechanism so that a session remains secure if either algorithm holds, providing quantum resistance without betting entirely on comparatively young cryptography. The dominant deployment pairs X25519 with ML-KEM, the NIST-standardized mechanism derived from CRYSTALS-Kyber and published as FIPS 203, with both shared secrets combined into the session key so an attacker must break both to recover plaintext. This hybrid construction is deliberate, hedging against undiscovered weaknesses or implementation flaws in the newer algorithm while immediately defeating harvest now decrypt later collection of intercepted traffic. Adoption has moved quickly for a cryptographic transition, with support shipping in mainstream browsers, major content delivery and cloud providers, OpenSSL and other core libraries, and a substantial and growing share of internet traffic now negotiating hybrid key exchange by default. Practical considerations include larger handshake messages that can exceed initial congestion windows and fragment across packets, middleboxes and legacy appliances that fail on unfamiliar key share sizes or oversized handshakes, and modest additional computation. Notably this addresses confidentiality only, since authentication still relies on classical signatures and certificate chains, and post-quantum certificate migration is a separate, larger undertaking constrained by signature sizes and the pace of public key infrastructure change.", technologies: ["OpenSSL", "Cloudflare", "Google Chrome", "AWS"] },
            { name: "Hybrid Threats & Hacktivism", category: "govern", maturity: "trending", description: "Hybrid threats - State-aligned disruption, influence and hacktivism", longDescription: "Hybrid threats combine cyber operations with information manipulation, physical sabotage, economic pressure, and proxy actors to achieve strategic objectives below the threshold of armed conflict, deliberately exploiting the ambiguity that complicates attribution and response. For enterprises the practical consequence is that organizations with no adversarial intent of their own become targets by virtue of nationality, sector, supply chain position, or public association with a geopolitical position. Manifestations include ideologically motivated hacktivist groups conducting distributed denial of service and defacement against symbolic targets, state-aligned actors operating behind hacktivist personas to obtain deniability, manipulation of exposed industrial control systems in water, energy, and manufacturing for psychological rather than material effect, coordinated disinformation targeting brand reputation or executive credibility, and sabotage of physical infrastructure including subsea cables and energy assets. European authorities including ENISA and national agencies have documented sustained increases in such activity, particularly against transport, energy, government, and media. Enterprise implications extend beyond technical controls to geopolitical risk monitoring feeding threat assessment, crisis communication prepared for narrative attacks, hardening of internet-exposed operational technology that provides easy symbolic targets, denial of service resilience proportionate to public profile, and coordination with national authorities and sector information sharing bodies whose intelligence on state-aligned campaigns is generally superior to commercial sources.", technologies: ["ENISA", "ANSSI", "Recorded Future", "Cloudflare"] },
            { name: "IaC Security & Policy-as-Code", category: "protect", maturity: "mature", description: "Infrastructure as code security - Shift-left cloud guardrails", longDescription: "Infrastructure as Code security scans declarative infrastructure definitions before deployment, catching misconfiguration in Terraform, CloudFormation, Kubernetes manifests, Helm charts, and container definitions at the point where a developer can fix it cheaply rather than after resources are live. Because cloud infrastructure is now created from templates, a single insecure module replicated across environments produces systematic exposure, making the template the highest leverage control point. Scanners evaluate configurations against rule sets covering public exposure, missing encryption, permissive identity policies, absent logging, insecure network rules, and container privilege settings, and run in pre-commit hooks, pull request checks, and pipeline gates. Policy as code generalizes the approach, expressing organizational requirements as executable policies in languages such as Rego or Kyverno rather than prose standards, then enforcing them consistently in pipelines and at Kubernetes admission so violations are blocked rather than documented. This produces auditable, version-controlled, testable security requirements and eliminates the drift between written policy and deployed reality. Effective programs pair enforcement with secure module libraries so teams receive compliant building blocks instead of only rejections, tune rule sets to remove noise that trains developers to ignore results, and reconcile scanned templates against runtime state to detect out-of-band changes that bypass the pipeline entirely.", technologies: ["Checkov", "Open Policy Agent", "Kyverno", "Snyk IaC"] },
            { name: "IAG & SoD (Identity Access Governance & Segregation of Duties)", category: "protect", maturity: "mature", description: "Access governance and duty separation - Privilege control", technologies: ["SailPoint", "Okta", "One Identity", "Ping"] },
            { name: "IAM of Things", category: "protect", maturity: "trending", description: "IAM for IoT - Connected device identity management", technologies: ["Azure IoT", "AWS IoT Core", "Google Cloud IoT", "Cisco IoT"] },
            { name: "IAM orchestration", category: "protect", maturity: "mature", description: "IAM orchestration - Identity/access workflow automation", technologies: ["Okta Workflows", "SailPoint", "One Identity", "Ping"] },
            { name: "IAMaaS (IAM as a Service)", category: "protect", maturity: "mature", description: "IAM as a service - Cloud-native IAM solution", technologies: ["Okta", "Auth0", "Azure AD", "Ping Identity"] },
            { name: "ID Threat DR (Identity Threat Disaster Recovery)", category: "protect", maturity: "trending", description: "Identity disaster recovery - Identity system recovery", technologies: ["Azure AD B2B", "Okta", "Ping Identity", "One Identity"] },
            { name: "Identity Analytics", category: "protect", maturity: "mature", description: "Identity analytics - Access behavior analysis", technologies: ["Splunk", "Azure AD Analytics", "Okta Analytics", "Ping"] },
            { name: "IEC 62443", category: "govern", maturity: "mature", description: "IEC 62443 - Standard for industrial automation security", longDescription: "IEC 62443 is the international standard series for security of industrial automation and control systems, providing the reference framework used by asset owners, system integrators, and product suppliers to specify and demonstrate operational technology security. Its structure addresses each role separately, with parts covering security programme requirements for asset owners, service requirements for integrators and maintenance providers, and secure development lifecycle and technical requirements for component and system suppliers, which allows security obligations to be assigned contractually across the parties that actually build and operate industrial systems. The central architectural concept is the division of a control environment into zones grouping assets with common security requirements, connected by conduits that carry controlled communication between them, with each zone assigned a target security level from one to four reflecting the capability of the adversary it must withstand. This produces a defensible and auditable segmentation model rather than a flat industrial network, and gives a common language for expressing requirements in procurement. Adoption is reinforced by regulation, since NIS2 and sector rules expect demonstrable industrial security management while the EU Cyber Resilience Act imposes secure development and vulnerability handling obligations on products, both of which map closely to the standard. Certification schemes exist for products, processes, and personnel, and are increasingly requested in industrial tenders.", technologies: ["IEC", "Claroty", "Siemens", "Schneider Electric"] },
            { name: "IIT Provisioning", category: "protect", maturity: "trending", description: "Just-in-time provisioning - Automated temporary access", technologies: ["Okta", "SailPoint", "Ping Identity", "One Identity"] },
            { name: "Immersive awareness", category: "govern", maturity: "trending", description: "Immersive awareness - Interactive cybersecurity training", technologies: ["Immersive Labs", "KnowBe4", "Proofpoint", "Infosec"] },
            { name: "Incident Recovery Env.", category: "recover", maturity: "mature", description: "Incident recovery environment - Recovery infrastructure", technologies: ["Zerto", "VMware Site", "AWS DRS", "Azure Site"] },
            { name: "Infostealer & Credential Marketplaces", category: "detect", maturity: "trending", description: "Infostealers - Stolen session and credential supply chains", longDescription: "Infostealer malware has become the primary supply mechanism for the credentials and session tokens that enable subsequent intrusion, operating as a distinct commercial layer of the criminal economy. Delivered through malicious advertising, cracked software, fake installers, and increasingly through fraudulent verification prompts that induce users to paste commands into a terminal, a stealer executes briefly and exfiltrates browser-stored passwords, session cookies, cryptocurrency wallets, and system information before removing itself, often leaving no persistent presence for endpoint tooling to find. The resulting logs are sold or distributed on marketplaces and messaging channels, packaged with search capability so a buyer can locate credentials for a specific target organization. The security significance is that stolen session cookies bypass multi-factor authentication entirely, and that infections frequently originate on unmanaged personal devices where corporate credentials were saved in a browser, placing the initial compromise outside enterprise visibility. Several major breaches have been traced to a single stealer log naming a contractor or employee. Defensive response combines monitoring stealer log feeds for organizational domains to trigger proactive credential and session revocation, eliminating password-based authentication in favour of hardware-bound passkeys, restricting corporate access from unmanaged devices, shortening session lifetimes with continuous re-evaluation, disabling browser credential storage through policy, and treating any appearance of a corporate identity in stealer data as a confirmed compromise requiring full session invalidation.", technologies: ["SpyCloud", "Flare", "Recorded Future", "Hudson Rock"] },
            { name: "Initial Access Broker (IAB)", category: "identify", maturity: "trending", description: "Initial access brokers - The market that precedes ransomware", longDescription: "Initial Access Brokers specialize in obtaining and selling access to compromised corporate networks, forming the intermediary layer that industrialized ransomware by separating intrusion from monetization. A broker compromises an organization through exposed remote services, exploitation of edge devices such as VPN concentrators and file transfer appliances, credentials purchased from infostealer logs, or social engineering, establishes reliable persistence, verifies and characterizes the access, then advertises it on criminal forums with details of sector, revenue, geography, and privilege level. A ransomware affiliate purchases the access and proceeds directly to lateral movement and deployment, having skipped the difficult and time-consuming intrusion phase. This division of labour has significant defensive implications. It means a dwell period frequently exists between compromise and encryption, sometimes weeks or months, during which detection of relatively quiet reconnaissance and persistence activity can prevent the incident entirely. It means edge device patching velocity is disproportionately consequential, since brokers scan and exploit newly disclosed vulnerabilities in internet-facing appliances within days. It also means access to an organization may be sold multiple times, so eradication must remove all persistence rather than the observed intrusion path alone. Threat intelligence monitoring of broker forums occasionally provides direct warning that access to an organization is listed for sale, offering an actionable window before ransomware deployment.", technologies: ["Intel 471", "KELA", "Recorded Future", "Google Threat Intelligence"] },
            { name: "ISMS (Information Security Management System)", category: "govern", maturity: "mature", description: "Information security management system - Integrated governance", technologies: ["Archer GRC", "Qualys VMDR", "ZenGRC", "AuditBoard"] },
            { name: "ISPM (Identity Security Posture Management)", category: "identify", maturity: "trending", description: "Identity security posture management - Finding identity attack paths", longDescription: "Identity Security Posture Management continuously assesses the configuration and hygiene of identity infrastructure to find the weaknesses attackers actually exploit, recognizing that identity has become the primary attack surface as credential-based intrusion outpaces malware-based intrusion. Where identity governance answers whether access is appropriate from a compliance perspective, ISPM asks whether the identity fabric itself is defensible. Assessment spans directory and identity provider configuration, discovering accounts exempted from multi-factor authentication, legacy authentication protocols still enabled, service accounts with interactive logon rights and non-expiring passwords, stale privileged accounts, weak conditional access policy gaps, unconstrained delegation and certificate template abuse in Active Directory, risky OAuth application grants in cloud tenants, and shadow identity providers created outside central control. Findings are expressed as attack paths rather than isolated defects, showing how a compromised workstation account chains through group nesting and delegation to domain or tenant administration, which allows remediation to target the specific edges that collapse many paths at once. Coverage extends across hybrid estates where on-premises directories, cloud identity providers, and SaaS local accounts create inconsistent enforcement. ISPM complements identity threat detection by removing exploitable conditions in advance, and its metrics such as multi-factor coverage and privileged account count give leadership a defensible measure of identity resilience.", technologies: ["Silverfort", "Push Security", "Microsoft Entra ID Protection", "Semperis"] },
            { name: "IT OT project management", category: "govern", maturity: "trending", description: "IT/OT project management - Mixed environment governance", technologies: ["ServiceNow ITSM", "BMC Remedy", "Atlassian Jira", "Microsoft Project"] },
            { name: "KMS (Key Management System)", category: "protect", maturity: "mature", description: "Key management system - Centralized key management", longDescription: "Key Management Systems provide centralized, secure management of cryptographic keys throughout their lifecycle including generation, distribution, storage, rotation, and destruction. KMS solutions ensure keys are protected in hardware security modules, enforce cryptographic policies, provide audit trails, enable automated key rotation, and integrate with applications requiring encryption. Centralized key management prevents key sprawl, ensures consistent cryptographic standards, enables rapid key rotation in response to compromise, maintains compliance, and provides visibility into cryptographic operations across the organization.", technologies: ["AWS KMS", "Azure Key Vault", "Thales Luna", "Google Cloud KMS"] },
            { name: "KSPM (Kubernetes Security Posture Mgt)", category: "identify", maturity: "trending", description: "Kubernetes security posture - Cluster configuration and hardening", longDescription: "Kubernetes Security Posture Management continuously evaluates cluster configuration against hardening benchmarks and organizational policy, addressing the reality that Kubernetes ships permissive by default and its complexity makes insecure configuration the norm rather than the exception. Assessment covers control plane exposure and API server settings, role-based access control bindings granting cluster administration to service accounts or broad groups, workloads running as root or with privileged security contexts, host namespace and hostPath mounts enabling node escape, absent network policies leaving all pod-to-pod traffic permitted, secrets stored unencrypted or exposed through environment variables, missing resource limits enabling denial of service, unrestricted image sources, and disabled audit logging. Results are typically mapped to CIS Kubernetes Benchmarks, NSA and CISA hardening guidance, and Pod Security Standards to give recognized reference points for auditors. Effective KSPM prioritizes by exploitability and context rather than emitting thousands of undifferentiated findings, distinguishing a privileged pod in an internet-exposed namespace handling regulated data from an equivalent setting in an isolated sandbox. Enforcement closes the loop by converting assessment rules into admission controls that reject non-compliant manifests, and by feeding findings into the templates and Helm charts teams reuse. Posture management pairs with runtime detection since correct configuration reduces but does not eliminate the need to observe live workload behavior.", technologies: ["ARMO Platform", "Sysdig Secure", "Aqua Security", "Kubescape"] },
            { name: "Living-off-the-Land & Pre-positioning", category: "detect", maturity: "trending", description: "LOTL techniques - Native tool abuse and strategic pre-positioning", longDescription: "Living-off-the-Land describes intrusion conducted using tools already present in the target environment rather than attacker-supplied malware, employing native administrative binaries, scripting engines, remote management utilities, and legitimate remote access software to perform reconnaissance, lateral movement, persistence, and exfiltration. Because every action is executed by signed, expected software performing operations that also occur legitimately, signature-based and file-focused detection fails, and the distinguishing signal lies in context rather than content, namely which account invoked which utility, from which parent process, against which target, at what time, and with what frequency. Government advisories have documented state-aligned actors using these techniques for strategic pre-positioning, quietly establishing durable footholds in critical infrastructure networks including energy, water, transport, and communications without conducting espionage or disruption, apparently to retain the option of disruptive effect at a moment of geopolitical choosing. Such intrusions have persisted undetected for years, and the absence of malware, exfiltration, or ransom demand removes the usual triggers that prompt investigation. Detection depends on behavioural analytics and baselining, command-line and script block logging, alerting on administrative tooling executed by accounts that do not normally use it, restricting or removing unnecessary interpreters and utilities, application control, and rigorous segmentation limiting reachability between corporate and operational networks so that a foothold cannot quietly extend toward control systems.", technologies: ["CISA", "CrowdStrike", "Microsoft Sentinel", "Sysmon"] },
            { name: "M&A security industrialization", category: "govern", maturity: "mature", description: "M&A security industrialization - Standardized acquisition processes", technologies: ["Archer GRC", "AuditBoard", "RSA Governance", "Workiva"] },
            { name: "Mainframe Identity", category: "protect", maturity: "mature", description: "Mainframe identity - Mainframe access management", technologies: ["CA Identity", "Delinea", "Okta", "One Identity"] },
            { name: "MCP Security (Model Context Protocol)", category: "protect", maturity: "emerging", description: "MCP security - Securing AI tool and data connectors", longDescription: "The Model Context Protocol standardizes how AI assistants connect to external tools and data sources, replacing bespoke integrations with a common client server interface. This standardization concentrates risk, since a single MCP server can expose file systems, databases, ticketing systems, or cloud APIs to any connected model. Threat patterns include malicious or typosquatted servers installed from community registries, tool description poisoning where instructions embedded in server metadata hijack model behavior, tool shadowing where a rogue server overrides a legitimate one, overbroad server permissions granting far more access than any task requires, credential exposure through servers holding long-lived tokens, and confused deputy conditions where a server executes actions the requesting user is not entitled to perform. Controls include curating an internal registry of vetted servers, pinning and signature verification for server artifacts, running servers in isolated containers with least privilege scoped credentials, mediating tool invocations through policy engines, requiring per-user authorization rather than shared service identities, and logging every tool call with the initiating principal. Reviewing tool descriptions as untrusted input is essential, since they enter the model context directly. As MCP becomes the default integration layer for enterprise AI, its security posture determines the blast radius of every connected assistant.", technologies: ["Anthropic MCP", "Descope Agentic Identity", "Auth0 for AI Agents", "Docker MCP Toolkit"] },
            { name: "MDR (Managed Detection & Response)", category: "detect", maturity: "mature", description: "Managed detection and response - Outsourced 24/7 detection capability", longDescription: "Managed Detection and Response delivers continuous monitoring, threat detection, investigation, and response as a service, providing round the clock security operations for organizations that cannot economically staff their own. The service differs from legacy managed security service provision in scope and posture, since a traditional provider forwarded alerts for the customer to interpret while an MDR provider investigates, determines whether an alert represents a real incident, and takes or directs containment action, delivering outcomes rather than notifications. Delivery combines a technology stack, usually endpoint detection, log collection, and network or identity telemetry, with a staffed operations centre, threat hunting, and detection engineering maintained across the customer base so intelligence from one intrusion improves detection for all. Engagement models range from provider-supplied technology to bring-your-own-tooling arrangements where the provider operates existing investments, which matters for organizations wanting to retain data ownership and avoid re-platforming. Evaluation should focus on response authority and the specific containment actions the provider may take without waiting for approval, since detection without a mandate to act at three in the morning yields little practical benefit, alongside measured time to detect and contain, transparency of detection logic, data residency, and the exit path if the relationship ends. MDR does not remove accountability, and the customer retains responsibility for asset inventory, escalation readiness, and remediation of underlying weaknesses.", technologies: ["Arctic Wolf", "Expel", "Sophos MDR", "Orange Cyberdefense"] },
            { name: "Medical Device Security", category: "protect", maturity: "trending", description: "Medical device security - Connected clinical equipment protection", longDescription: "Medical device security addresses connected clinical equipment including imaging systems, infusion pumps, patient monitors, laboratory analysers, and implantable device programmers, where compromise carries direct patient safety consequences alongside data protection risk. The environment is structurally difficult, since devices are regulated as medical products so unauthorized modification including patching can invalidate certification, service life extends far beyond that of general computing equipment leaving unsupported operating systems in clinical use for a decade or more, availability requirements prohibit disruptive scanning or unplanned restarts, vendor maintenance access is often required through remote connections outside hospital control, and ownership frequently sits with biomedical engineering rather than information security. Regulatory expectations have tightened significantly, with US requirements now obliging manufacturers to submit cybersecurity plans, software bills of materials, and post-market vulnerability management for premarket authorization, and European rules under the Medical Device Regulation together with the Cyber Resilience Act imposing comparable secure development and vulnerability handling duties. For healthcare providers the practical programme centres on complete passive inventory of connected clinical assets with firmware visibility, network segmentation isolating devices to the specific communication their clinical function requires, brokered and recorded vendor remote access, procurement requirements demanding software bills of materials and defined support lifetimes, and clinically informed incident response recognizing that isolating a device may itself create patient risk.", technologies: ["Armis", "Claroty Medigate", "Cynerio", "Ordr"] },
            { name: "MFA (Multi-Factor Authentication)", category: "protect", maturity: "mature", description: "Multi-factor authentication - Standard MFA", longDescription: "Multi-Factor Authentication strengthens security by requiring multiple verification factors beyond passwords, typically combining something you know (password), something you have (token/phone), and something you are (biometric). MFA significantly reduces account compromise risk by ensuring that stolen passwords alone cannot grant access. Organizations implement MFA for remote access, privileged accounts, sensitive applications, and increasingly for all user access as part of zero trust strategies. Modern MFA includes push notifications, TOTP codes, SMS codes, hardware tokens, and biometrics. While dramatically improving security, organizations must balance security with user experience, provide backup authentication methods, and consider phishing-resistant options like FIDO2. As credential theft remains a primary attack vector, MFA has become a fundamental security control.", technologies: ["Duo Security", "Okta MFA", "Microsoft MFA", "Google Authenticator"] },
            { name: "Micro segmentation", category: "protect", maturity: "mature", description: "Micro-segmentation - Granular network segmentation", longDescription: "Micro-segmentation creates granular security zones within networks, implementing zero trust network principles by requiring explicit authorization for all communication between workloads regardless of network location. Unlike traditional perimeter security, micro-segmentation applies policies at the workload level, preventing lateral movement even within trusted networks. This approach limits breach impact by containing compromised systems, enforces least privilege network access, simplifies compliance through granular controls, and provides visibility into application communication patterns. Implementation uses software-defined networking, host-based firewalls, or cloud security groups to enforce policies.", technologies: ["VMware NSX", "Cisco ACI", "Fortinet", "Palo Alto"] },
            { name: "MLSecOps (ML Security Operations)", category: "identify", maturity: "emerging", description: "ML Security Operations - ML model security hardening", technologies: ["TensorFlow Security", "MLflow", "Kubeflow", "Databricks"] },
            { name: "Modern authentication", category: "protect", maturity: "mature", description: "Modern authentication - Modern authentication approaches", technologies: ["OAuth2", "OIDC", "SAML 2.0", "JWT"] },
            { name: "Multi-cloud continuity", category: "govern", maturity: "mature", description: "Multi-cloud continuity - Portability and resilience between clouds", technologies: ["AWS", "Azure", "Google Cloud", "HashiCorp Terraform"] },
            { name: "NIS2 Transposition", category: "govern", maturity: "trending", description: "NIS2 transposition - National implementation and enforcement", longDescription: "NIS2 transposition concerns the translation of the European directive on network and information systems security into national law, which is where its practical obligations are determined. Because a directive sets objectives while member states legislate the detail, the resulting national regimes differ in scope thresholds, sector interpretation, registration procedures, supervisory arrangements, and penalty calibration, and transposition has proceeded unevenly with several states missing the deadline, leaving multinational groups managing divergent requirements and timelines across jurisdictions. The directive substantially widens coverage relative to its predecessor, adding sectors such as manufacturing, food, waste, postal services, chemicals, digital providers, and public administration, and classifying entities as essential or important with correspondingly stricter supervision. Core obligations include risk management measures spanning incident handling, business continuity, supply chain security, vulnerability disclosure, cryptography, and access control, together with a staged incident notification regime requiring an early warning within twenty-four hours, an incident notification within seventy-two hours, and a final report within one month. The most significant change is accountability, since management bodies must approve and oversee cybersecurity measures, may be held personally liable for breaches of that duty, and are required to undertake relevant training. Compliance programmes therefore require legal analysis of each national implementation rather than reliance on the directive text alone, and supply chain clauses cascading requirements to suppliers.", technologies: ["ANSSI", "BSI", "ENISA", "OneTrust"] },
            { name: "Non-Human Identities", category: "protect", maturity: "trending", description: "Non-human identities - Machine/service access management", technologies: ["CyberArk PAM", "HashiCorp Consul", "Kubernetes RBAC", "AWS IAM"] },
            { name: "Notification requirements (SEC/NIS/DFS)", category: "govern", maturity: "mature", description: "Notification requirements - Compliance with notification rules", technologies: ["OneTrust", "Workiva", "AuditBoard", "RSA"] },
            { name: "OAuth2 & Identity Federation", category: "protect", maturity: "mature", description: "OAuth 2.0 and identity federation - Authorization and federation standards", technologies: ["Auth0", "Okta", "Ping Identity", "Microsoft Entra"] },
            { name: "OCSF (Open Cybersecurity Schema Framework)", category: "detect", maturity: "trending", description: "OCSF - Vendor-neutral schema for security event data", longDescription: "The Open Cybersecurity Schema Framework defines a vendor-neutral taxonomy and schema for security event data, addressing the normalization burden that consumes a large share of security engineering effort. Every security product emits its own event format with distinct field names, value conventions, and structures, so a query for authentication failures must be written differently for each source, detection content cannot be shared, and replacing a tool invalidates every dependent rule, dashboard, and integration. OCSF establishes common event classes for activities such as authentication, process execution, network connection, file access, and API calls, each with defined attributes and enumerated values, plus profiles extending classes for specific contexts. Data mapped to the schema becomes queryable uniformly regardless of origin, letting detection logic and analytics be authored once and applied across sources. Adoption by major cloud providers, security vendors, and data platforms has made the framework the emerging default for security data lake architectures, where events from many sources land in shared storage and are analyzed by multiple tools. Strategic value lies in decoupling data from analytics, since organizations retaining their own OCSF-formatted data can change detection or SIEM tooling without re-instrumenting collection. Practical limitations include incomplete vendor mappings, lossy translation of product-specific fields, and the ongoing effort of maintaining mappings as schema versions evolve.", technologies: ["OCSF", "Amazon Security Lake", "Splunk", "Snowflake"] },
            { name: "OPC UA", category: "protect", maturity: "mature", description: "OPC Unified Architecture - Secure IT/OT communication standard", technologies: ["Kepware", "Ignition", "Wonderware", "FactoryTalk"] },
            { name: "OpRes Regulations", category: "govern", maturity: "trending", description: "Operational resilience regulations - New rules compliance", technologies: ["Fortinet", "Splunk", "Elastic", "Datadog"] },
            { name: "OT DevSecOps", category: "govern", maturity: "trending", description: "OT DevSecOps - Secure development for operational systems", technologies: ["Fortinet FortiICS", "Rockwell Automation", "Schneider", "Siemens"] },
            { name: "OT probe", category: "detect", maturity: "mature", description: "OT probe - Sensor for operational system monitoring", technologies: ["Claroty", "Fortinet FortiOT", "Tenable OT", "Nozomi Networks"] },
            { name: "OT Resilience", category: "recover", maturity: "mature", description: "OT resilience - Operational and industrial system resilience", technologies: ["Fortinet FortiICS", "Claroty", "Tenable OT", "Nozomi"] },
            { name: "PAM (Privileged Access Management)", category: "protect", maturity: "mature", description: "Privileged access management - Privileged account control", longDescription: "Privileged Access Management secures, controls, and monitors access to critical systems and sensitive data by users with elevated permissions. PAM solutions vault privileged credentials, require approval workflows for privileged access, provide session recording and monitoring, implement just-in-time access, rotate passwords automatically, and detect anomalous privileged user behavior. These controls prevent credential theft, ensure accountability through audit trails, enable rapid credential rotation following security events, and detect insider threats or compromised accounts. Organizations implement PAM to protect against privilege misuse, meet compliance requirements, reduce attack surface, and maintain visibility into administrative activities. As privileged accounts remain primary targets for attackers seeking persistent access, comprehensive PAM programs are essential security controls for protecting critical assets.", technologies: ["CyberArk", "BeyondTrust", "Delinea", "HashiCorp"] },
            { name: "Passwordless authentication", category: "protect", maturity: "trending", description: "Passwordless authentication - FIDO2 and alternatives", technologies: ["FIDO2", "Windows Hello", "Yubico", "Okta"] },
            { name: "Phishing resistant authentication", category: "protect", maturity: "trending", description: "Phishing-resistant authentication - FIDO2 and advanced MFA", technologies: ["FIDO2", "Windows Hello", "Duo", "Yubico"] },
            { name: "PKI (Public Key Infrastructure)", category: "protect", maturity: "mature", description: "Public key infrastructure - Digital certificate management", technologies: ["Thales HSM", "Venafi", "Sectigo", "GlobalSign"] },
            { name: "PLC code security", category: "protect", maturity: "mature", description: "PLC code security - OT automation code protection", technologies: ["Fortinet FortiICS", "Claroty", "Tenable OT", "CyberArk"] },
            { name: "Post Quantum Crypto", category: "protect", maturity: "emerging", description: "Post-quantum cryptography - Quantum-resistant cryptography", technologies: ["NIST PQC", "LibOQS", "Google Quantum", "Microsoft PQ"] },
            { name: "PQC Migration Roadmap", category: "govern", maturity: "trending", description: "PQC migration roadmap - Planning the transition to quantum-safe crypto", longDescription: "A post-quantum cryptography migration roadmap is the multi-year governance programme translating quantum risk into a sequenced plan of inventory, prioritization, remediation, and validation. Regulatory and national guidance has converged on explicit timelines, with NIST having standardized ML-KEM, ML-DSA, and SLH-DSA and published deprecation guidance for classical asymmetric algorithms, while national authorities including ANSSI, BSI, and NCSC have issued staged migration expectations and the US federal sector operates under statutory inventory and reporting requirements. This makes migration a compliance obligation with dates rather than a research topic. A credible roadmap begins with cryptographic discovery producing a bill of materials, then classifies systems by confidentiality lifetime and exposure to derive priority, since data requiring decades of protection and externally reachable key exchange come first. Remediation sequencing typically starts with transport encryption where hybrid key exchange can be enabled with limited disruption, proceeds through public key infrastructure and code signing where longer lead times and larger signatures create constraints, and addresses embedded, industrial, and hardware-rooted systems last given replacement cycles measured in decades. Supplier engagement is essential because most cryptography arrives in purchased products, requiring contractual commitments to quantum-safe roadmaps. Crypto agility is the durable objective, since organizations able to change algorithms without re-architecting will absorb this transition and the next at far lower cost.", technologies: ["NIST PQC", "ANSSI", "BSI", "IBM Quantum Safe"] },
            { name: "Predictive anti-fraud", category: "protect", maturity: "mature", description: "Predictive anti-fraud - AI-based fraud detection", technologies: ["RSA Archer", "Feedzai", "Kount", "Riskified"] },
            { name: "Preemptive Security Solutions", category: "protect", maturity: "emerging", description: "Preemptive security solutions - Proactive threat prevention", longDescription: "Preemptive security solutions are proactive cybersecurity capabilities designed to identify, predict, and neutralize threats before they can impact systems, users, or data. Unlike reactive security approaches that focus primarily on detecting and responding after compromise, preemptive strategies combine continuous risk assessment, threat intelligence, attack surface monitoring, automated policy enforcement, and preventive controls such as hardening, segmentation, and adaptive access decisions. These solutions aim to reduce the probability of successful attacks by anticipating attacker behavior, eliminating exploitable weaknesses early, and interrupting attack paths at initial stages. In practice, organizations apply preemptive security across cloud, endpoint, identity, and network domains to shift left on prevention, reduce incident frequency, and improve overall resilience.", technologies: ["Attack Surface Management", "Threat Intelligence", "XDR", "Zero Trust Access"] },
            { name: "Privacy management", category: "govern", maturity: "mature", description: "Privacy management - Privacy by design and GDPR", longDescription: "Privacy Management programs ensure organizations handle personal data in compliance with regulations like GDPR, CCPA, and emerging privacy laws worldwide. Comprehensive privacy programs include data inventory and mapping, privacy impact assessments, consent management, data subject rights workflows, breach notification procedures, vendor privacy assessments, and privacy-by-design principles. Organizations must maintain accurate records of processing activities, respond to data subject requests, implement appropriate technical and organizational measures, and demonstrate accountability. As privacy regulations proliferate globally with significant penalties, mature privacy programs have become business imperatives.", technologies: ["OneTrust", "TrustArc", "IBM Privacy", "BigID"] },
            { name: "Prompt Injection Defense", category: "protect", maturity: "emerging", description: "Prompt injection defense - Countering instruction hijacking in LLMs", longDescription: "Prompt injection is the foundational vulnerability class of language model applications, arising because models process instructions and data in the same token stream and cannot reliably distinguish developer intent from adversarial text encountered at runtime. Direct injection occurs when a user crafts input overriding system instructions, while indirect injection hides instructions in content the model retrieves, such as web pages, documents, emails, code comments, calendar invites, or API responses, allowing an attacker who never interacts with the application to steer it. Consequences escalate sharply in agentic deployments, where a successful injection can exfiltrate retrieved data, invoke tools with the user privileges, poison persistent memory, or pivot into connected systems. No complete mitigation exists, so defense is layered, combining strict separation and delimiting of untrusted content, instruction hierarchies and spotlighting techniques, classifier based detection of injection patterns, output filtering blocking data exfiltration channels such as rendered images and links, least privilege tool scoping so a hijacked model cannot exceed task bounds, human confirmation for irreversible actions, and continuous red teaming with evolving payload corpora. Ranked first in the OWASP Top 10 for LLM Applications, prompt injection should be treated as an assumed condition and contained architecturally rather than expected to be eliminated.", technologies: ["Lakera Guard", "Prompt Security", "Protect AI", "Robust Intelligence"] },
            { name: "Purple team", category: "identify", maturity: "trending", description: "Purple team - Collaboration between red and blue teams", technologies: ["Atomic Red Team", "Caldera", "Gremlin", "Chaos Toolkit"] },
            { name: "QKD (Quantum Key Distribution)", category: "protect", maturity: "emerging", description: "Quantum key distribution - Physics-based key exchange over fibre", longDescription: "Quantum Key Distribution uses the properties of quantum mechanics to establish shared encryption keys between two parties, deriving security from physical law rather than computational hardness. Because measuring a quantum state disturbs it, any interception attempt introduces detectable errors, allowing the parties to identify eavesdropping and discard compromised key material. This provides information-theoretic security for key establishment that remains valid regardless of adversary computing power, including quantum computers. Deployment requires specialized hardware and dedicated optical fibre or free-space optical links, with distance limited by photon loss to roughly a few hundred kilometres without trusted relay nodes or immature quantum repeaters. National and regional investment is significant, notably the European EuroQCI initiative building a continental quantum communication infrastructure combining terrestrial fibre and satellite segments, alongside comparable programmes in China, Japan, and elsewhere, positioning QKD as sovereign communications infrastructure for government, defence, and critical financial links. Security authorities including ANSSI, BSI, and NSA have nonetheless cautioned that QKD is not a general replacement for post-quantum cryptography, since it addresses only key distribution and not authentication, requires an authenticated classical channel, depends on trusted hardware whose implementation can be attacked, cannot traverse the routed internet, and carries costs that restrict it to point-to-point links of exceptional value. Practical architectures therefore treat QKD as complementary to algorithmic post-quantum migration.", technologies: ["ID Quantique", "Toshiba QKD", "EuroQCI", "Orange"] },
            { name: "RaaS & Double Extortion", category: "identify", maturity: "mature", description: "Ransomware-as-a-Service - Affiliate model and data extortion", longDescription: "Ransomware as a Service restructured extortion into a specialized supply chain in which developers build and maintain encryption tooling, leak infrastructure, and negotiation portals, then license them to affiliates who conduct intrusions and share proceeds. This division of labour lowered the technical barrier to entry, multiplied the number of active operators, and made attribution and disruption harder since dismantling one brand disperses affiliates who reappear under new names with the same tradecraft. The dominant monetization pattern is double extortion, where data is exfiltrated before encryption so that refusing to pay results in publication on a leak site, which defeats the protection that reliable backups previously provided and converts a recoverable availability incident into a permanent confidentiality breach with regulatory notification, contractual, and litigation consequences. Pressure tactics have escalated further to include direct contact with customers, employees, and partners whose data was taken, complaints to regulators about the victim non-disclosure, and denial of service against remaining infrastructure. Some operators now skip encryption entirely, relying on exfiltration alone. The practical implication for defenders is that resilience planning cannot rest on recovery capability alone, and must address exfiltration prevention and detection, data minimization to reduce what can be stolen, segmentation limiting reachable data, and prepared crisis processes covering legal, regulatory, and communications dimensions from the outset.", technologies: ["Recorded Future", "Google Threat Intelligence", "Intel 471", "CrowdStrike"] },
            { name: "RAG & Vector Database Security", category: "protect", maturity: "emerging", description: "RAG security - Protecting retrieval pipelines and embedding stores", longDescription: "Retrieval augmented generation grounds language model responses in enterprise data by embedding documents into vector stores and injecting retrieved passages into prompts, creating a data pipeline whose security properties are frequently overlooked. The dominant failure mode is permission collapse, where ingestion flattens source access controls so any user querying the assistant can retrieve content from repositories they were never authorized to read, turning a chatbot into a mass disclosure channel. Additional risks include knowledge base poisoning, in which an attacker plants documents containing false facts or embedded instructions that the model later treats as authoritative, embedding inversion attacks reconstructing sensitive source text from stored vectors, vector stores deployed without authentication or encryption, cross-tenant leakage from shared indexes, and retrieval of stale content that should have been deleted under retention or erasure obligations. Controls include propagating source system entitlements into the index and filtering retrieval per user identity, classifying and excluding regulated content at ingestion, treating retrieved passages as untrusted input rather than trusted context, encrypting and access controlling the vector store as a production data asset, validating and provenance tagging ingested documents, and synchronizing deletions from source systems. Governance of the retrieval layer, not the model, determines whether RAG deployments respect existing data protection commitments.", technologies: ["Pinecone", "Weaviate", "Securiti", "Elastic Vector Search"] },

            { name: "Red team", category: "identify", maturity: "mature", description: "Red team - Expert-led attack simulation", longDescription: "Red teams simulate real-world attackers by using adversary tactics, techniques, and procedures to test organizational defenses comprehensively. Unlike vulnerability scans or penetration tests with defined scope, red teams operate with minimal constraints attempting to achieve specific objectives like data exfiltration or system compromise. Exercises test not just technical controls but also detection capabilities, incident response procedures, and security team effectiveness. Red teaming provides realistic assessment of security posture, identifies gaps in defenses, validates security investments, and improves team readiness through adversarial simulation.", technologies: ["Atomic Red Team", "Caldera", "MITRE ATT&CK", "Pentera", "Mandiant"] },

            { name: "S-SDLC (Secure Software Development Lifecycle)", category: "protect", maturity: "mature", description: "Secure software development lifecycle - Security integration in DevOps", technologies: ["GitLab DevSecOps", "GitHub Advanced Security", "Synopsys", "Checkmarx"] },
