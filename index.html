            { name: "SASE (Secure Access Service Edge)", category: "protect", maturity: "mature", description: "Secure access service edge - Converged network and security cloud", longDescription: "Secure Access Service Edge converges wide area networking and network security into a single cloud-delivered service, replacing the architecture in which branch traffic is backhauled to a data centre security stack before reaching the internet. A SASE platform combines software-defined WAN for path selection and application-aware routing with a security service edge stack comprising secure web gateway, cloud access security broker, zero trust network access, firewall as a service, and data loss prevention, all enforced at distributed points of presence close to users. Policy is expressed against identity, device posture, application, and data sensitivity rather than network location, and evaluated consistently whether the user sits in an office, at home, or on a mobile network. Benefits include reduced latency by terminating traffic locally instead of hairpinning, retirement of appliance refresh cycles and VPN concentrators, uniform policy across all access paths, and consolidated telemetry replacing fragmented appliance logs. Adoption considerations include vendor lock-in given the breadth of the platform, the operational shift from network teams managing devices to policy engineering, dependency on provider availability and point of presence coverage in required jurisdictions, and data residency implications when inspection occurs in provider infrastructure. SASE is now the reference architecture for distributed enterprises retiring perimeter-centric designs.", technologies: ["Netskope", "Zscaler", "Palo Alto Prisma SASE", "Cato Networks"] },
            { name: "SAST & DAST Combined", category: "identify", maturity: "mature", description: "Static and dynamic combined testing - Complete code analysis", technologies: ["Checkmarx", "Veracode", "SonarQube", "Fortify"] },
            { name: "SBOM/SCA (Software Bill of Materials / Composition Analysis)", category: "identify", maturity: "trending", description: "Software inventory and component analysis - Dependency management", technologies: ["Snyk", "Black Duck", "Sonatype", "Synopsys", "Dependency-Check"] },
            { name: "SCADA Virtualization", category: "protect", maturity: "emerging", description: "SCADA virtualization - SCADA/OT system virtualization", technologies: ["Fortinet", "VMware", "Hyper-V", "KVM"] },
            { name: "SDV & UN R155 (Automotive)", category: "govern", maturity: "trending", description: "Software-defined vehicle security - UN R155 and automotive CSMS", longDescription: "Automotive cybersecurity regulation, principally UN Regulation No. 155 with its companion R156 on software updates, requires vehicle manufacturers to operate a certified Cyber Security Management System covering the entire vehicle lifecycle as a condition of type approval in participating markets. This makes cybersecurity a homologation requirement rather than a voluntary quality attribute, meaning a manufacturer unable to demonstrate the required processes cannot sell the vehicle. The regulation obliges risk assessment across the vehicle architecture, implementation of proportionate controls, monitoring of vehicles in the field for attacks and vulnerabilities, capability to respond to incidents affecting a deployed fleet, and secure over-the-air update processes with rollback protection and integrity verification. The accompanying standard ISO/SAE 21434 provides the engineering framework for meeting these obligations across concept, development, production, operation, and decommissioning phases. Technical scope reflects the shift to software-defined vehicles, where consolidated high-performance computers, service-oriented internal architectures replacing point-to-point wiring, continuous connectivity, and third-party application ecosystems expand the attack surface far beyond earlier generations, while the safety consequence of compromise involves braking, steering, and driver assistance functions. Obligations cascade contractually through a deep tier-one and tier-two supplier base, requiring component suppliers to provide security cases, software bills of materials, vulnerability disclosure processes, and long-term support commitments matched to vehicle service life.", technologies: ["UNECE", "ISO/SAE 21434", "ETAS", "Vector Informatik"] },
            { name: "SecNumCloud", category: "govern", maturity: "trending", description: "SecNumCloud - French sovereign cloud security qualification", longDescription: "SecNumCloud is a cloud security qualification framework developed by ANSSI (Agence Nationale de la Sécurité des Systèmes d'Information), France's national cybersecurity agency, designed to ensure sensitive and critical data stored in cloud environments benefits from robust security and sovereignty protections. The framework defines technical security requirements, organizational measures, and critically, legal immunization clauses requiring that qualified cloud providers not be subject to non-EU law that could compel disclosure of customer data to foreign authorities. This directly addresses the risk of US CLOUD Act or similar extraterritorial access to French and European data. SecNumCloud qualification requires cloud providers to demonstrate comprehensive technical security controls, undergo independent audits by ANSSI-certified auditors, implement strict data handling procedures, and ensure their corporate structure prevents foreign law enforcement access to customer data. French critical infrastructure operators and government entities are increasingly required to use SecNumCloud-qualified services for sensitive and classified data workloads. The framework has directly influenced the EU-level EUCS scheme's highest assurance tier and represents France's sovereign cloud strategy. Qualified providers include OVHcloud, Outscale (Dassault Systèmes subsidiary), and S3NS (Thales-Google partnership), with several others in the qualification process.", technologies: ["ANSSI", "OVHcloud", "Outscale", "S3NS"] },
            { name: "Sectorial Compliance", category: "govern", maturity: "mature", description: "Sectorial compliance - Sector-specific compliance", technologies: ["Archer GRC", "OneTrust", "Workiva", "AuditBoard"] },
            { name: "Secure administration", category: "protect", maturity: "mature", description: "Secure administration - Secure administrative access", technologies: ["CyberArk PAM", "BeyondTrust", "Delinea", "HashiCorp"] },
            { name: "Secure Enterprise Browser", category: "protect", maturity: "trending", description: "Enterprise browser - Security enforcement inside the work application", longDescription: "The secure enterprise browser places security controls inside the application where most work now happens, addressing the reality that SaaS adoption has made the browser the primary enterprise endpoint while conventional tooling has limited visibility into what occurs within a browser session. Delivered either as a managed Chromium-based browser or as an extension layered onto existing browsers, these products enforce last mile controls that network inspection cannot reach, including preventing copy, paste, download, print and screenshot of sensitive application data, watermarking displayed content, restricting file uploads to unsanctioned destinations, and blocking risky extensions. Because enforcement occurs after decryption in the rendering context, controls apply to encrypted sessions without traffic interception and remain effective for personal and unmanaged devices. Principal use cases include contractor and offshore access to sensitive applications without shipping corporate laptops or deploying virtual desktops, protecting privileged administrative consoles, securing bring-your-own-device access, phishing resistance through real-time page analysis, and governing which AI tools receive corporate data with granular paste controls. Detailed session telemetry provides investigation evidence and shadow SaaS discovery. Adoption obstacles include user resistance to changing browsers, extension conflicts, and the need to integrate browser policy with existing identity and data protection systems rather than creating a parallel silo.", technologies: ["Island", "Palo Alto Prisma Access Browser", "Chrome Enterprise Premium", "Seraphic"] },
            { name: "Security data hub", category: "detect", maturity: "trending", description: "Security data hub - Centralized aggregation of security data", technologies: ["Splunk Enterprise", "Elasticsearch", "Datadog", "AWS Security Lake", "Chronicle"] },
            { name: "Security Data Pipeline", category: "detect", maturity: "trending", description: "Security data pipeline - Routing, shaping and optimizing telemetry", longDescription: "Security data pipeline management inserts a processing layer between telemetry sources and analytics destinations, decoupling collection from the platforms that consume data and giving security teams control over volume, shape, and routing. The driver is economic and architectural, since SIEM licensing scales with ingested volume while telemetry grows relentlessly with cloud adoption, forcing teams to choose between visibility and budget, and since sources coupled directly to a single destination make platform migration prohibitively expensive. A pipeline receives events from agents, cloud streams, and network sensors, then filters low-value records, removes redundant fields, aggregates repetitive events into summaries, enriches records with asset ownership, identity context, and threat intelligence, normalizes formats toward a common schema, and routes each stream to appropriate destinations. Routing typically sends high-value security-relevant events to the detection platform while archiving full-fidelity data to inexpensive object storage that remains searchable for investigation and compliance retention, often reducing detection platform volume substantially without losing forensic capability. Additional functions include masking sensitive fields before data crosses jurisdictional or contractual boundaries, buffering during destination outages to prevent gap creation, and replaying archived data into new platforms during migration or retroactive hunting. The pipeline becomes strategic infrastructure, since owning it means owning the data and retaining freedom to change analytics tooling without re-engineering collection.", technologies: ["Cribl", "DataBahn", "Tenzir", "Vector"] },
            { name: "Serverless apps security", category: "protect", maturity: "emerging", description: "Serverless applications security - Serverless function security", technologies: ["AWS Lambda Security", "Azure Functions", "Google Cloud Functions"] },
            { name: "Service catalog", category: "govern", maturity: "mature", description: "Service catalog - IT/security services inventory", technologies: ["ServiceNow ITSM", "BMC Remedy", "Jira Service Management"] },
            { name: "Shadow AI Discovery", category: "identify", maturity: "trending", description: "Shadow AI discovery - Finding unsanctioned AI use and data exposure", longDescription: "Shadow AI describes the use of artificial intelligence tools outside enterprise governance, ranging from employees pasting confidential material into consumer chatbots to development teams embedding third-party model APIs in production code and business units enabling AI features inside existing SaaS platforms. Adoption speed and the low friction of browser-based tools mean shadow AI typically exists at scale before any policy is written, creating exposure through confidential data leaving the organization, regulated personal data processed without a lawful basis or transfer assessment, intellectual property absorbed into third-party training corpora, and unvetted model output flowing into decisions and code. Discovery combines network and secure web gateway telemetry identifying traffic to AI endpoints, browser and endpoint agents observing paste and upload behavior into AI interfaces, SaaS posture tooling detecting AI features and connected AI apps with OAuth grants, cloud and code scanning locating model SDKs and API keys, and expense analysis revealing unmanaged subscriptions. Effective programs pair discovery with a pragmatic response path, offering sanctioned alternatives through an approved gateway rather than blanket blocking that pushes usage further underground, then applying data loss controls, per-tool risk assessments, and continuous monitoring. Visibility is the prerequisite, since AI governance frameworks cannot regulate systems the organization cannot see.", technologies: ["Netskope", "Zscaler", "Harmonic Security", "Nightfall AI"] },
            { name: "Sigstore & Artifact Signing", category: "protect", maturity: "trending", description: "Artifact signing - Keyless signatures with transparency logs", longDescription: "Sigstore provides infrastructure for signing and verifying software artifacts without the key management burden that prevented widespread adoption of code signing in open source and internal development. Traditional signing requires generating long-lived private keys, protecting them, distributing corresponding public keys, and revoking compromised ones, an operational overhead that most projects never sustained. Sigstore replaces this with keyless signing, where a signer authenticates through an existing identity provider or workload identity, receives a short-lived signing certificate binding that identity to an ephemeral key, signs the artifact, and discards the key, so there is no persistent secret to steal. Every signature is recorded in a public append-only transparency log, allowing anyone to detect unexpected signatures for an artifact and providing an auditable history that makes silent misuse of a compromised identity detectable. Verification therefore checks not only that a signature is valid but that it was produced by an expected identity, such as a specific repository workflow, and is present in the log. Adoption has been rapid across container registries, language package ecosystems, and Kubernetes tooling, and policy engines at admission time can require valid signatures from approved identities before an image runs. Combined with provenance attestations, artifact signing shifts supply chain security from trusting a registry to cryptographically verifying origin.", technologies: ["Sigstore", "Cosign", "Rekor", "Chainguard"] },
            { name: "SLSA Framework", category: "protect", maturity: "trending", description: "SLSA - Graduated supply chain integrity assurance levels", longDescription: "Supply-chain Levels for Software Artifacts is a framework defining graduated, checkable requirements for the integrity of a software build process, giving producers a roadmap and consumers a way to express expectations. Rather than an aspirational maturity model, its levels correspond to specific verifiable properties of how an artifact was produced. The entry level requires that provenance be generated and made available, describing the source and build process. The intermediate level requires that provenance be produced by a hosted build platform rather than asserted by the developer, and be cryptographically signed, which prevents falsification by a compromised developer workstation. Higher levels add hardened build platforms with isolated, ephemeral build environments, prevention of build-time interference between steps, and restrictions ensuring builds are reproducible from declared inputs, progressively eliminating the paths by which an attacker could inject code that appears in the artifact but not the source. The framework exists because notable supply chain compromises subverted the build system rather than the source repository, so source-focused controls such as code review and branch protection could not detect them. Practical adoption is driven by consumers, since procurement requirements, package ecosystem policies, and government software attestation frameworks increasingly reference SLSA levels, giving suppliers a concrete and externally recognized target rather than an abstract commitment to supply chain security.", technologies: ["SLSA", "GitHub Actions", "Google Cloud Build", "Chainguard"] },
            { name: "Small entity security", category: "govern", maturity: "mature", description: "Small entity security - SME-adapted security", technologies: ["Microsoft Defender", "Bitdefender", "Kaspersky", "Avast Business"] },
            { name: "Smart Sourcing", category: "govern", maturity: "mature", description: "Smart sourcing - Intelligent vendor/service selection", technologies: ["SAP Ariba", "Coupa", "Tradeshift", "TrustRadius"] },
            { name: "SOAR (Security Orchestration, Automation and Response)", category: "respond", maturity: "mature", description: "Security orchestration and automation - Incident response automation", longDescription: "Security Orchestration, Automation and Response platforms integrate security tools, automate response workflows, and orchestrate incident response across security infrastructure. SOAR solutions connect disparate security tools through APIs, execute automated playbooks responding to security alerts, enrich alerts with threat intelligence, coordinate response actions, and provide case management. Organizations use SOAR to accelerate response times, ensure consistent incident handling, reduce analyst workload through automation, and improve security operations efficiency. By automating repetitive tasks, SOAR enables analysts to focus on complex investigations and strategic security improvements.", technologies: ["Splunk SOAR", "Demisto", "Siemplify", "ServiceNow SecOps"] },
            { name: "Sovereign AI", category: "govern", maturity: "emerging", description: "Sovereign AI - Artificial intelligence under national jurisdiction and control", longDescription: "Sovereign AI refers to artificial intelligence capabilities — including foundation models, training infrastructure, and inference services — developed and operated under national jurisdiction and control, reducing dependence on foreign AI providers that may be subject to foreign laws, geopolitical pressures, or export controls. The concept encompasses developing domestic AI foundation models, deploying AI inference infrastructure in sovereign cloud environments, using open-source models that can be self-hosted and audited, and establishing governance frameworks for AI use aligned with national values and regulations. European sovereign AI initiatives include national investments in AI research such as Germany's Aleph Alpha, France's Mistral AI, and EU programs investing in AI supercomputing infrastructure through the EuroHPC Joint Undertaking. Organizations assess sovereign AI needs by evaluating data sensitivity in AI training and inference pipelines, regulatory requirements for data handling, risks from foreign AI provider dependence, and strategic importance of maintaining domestic AI capabilities. Sensitive government, defense, healthcare, and financial workloads increasingly drive requirements for AI inference that occurs entirely within sovereign infrastructure, preventing training data or sensitive queries from transiting foreign-controlled systems.", technologies: ["Mistral AI", "Aleph Alpha", "GAIA-X", "OVHcloud"] },
            { name: "Sovereign Cloud", category: "govern", maturity: "trending", description: "Sovereign cloud - Cloud infrastructure under national jurisdiction", longDescription: "Sovereign cloud refers to cloud computing infrastructure and services specifically designed to comply with national sovereignty requirements, ensuring that data remains under the jurisdiction and control of the country or region where it originates. Sovereign cloud solutions address legal, regulatory, and geopolitical concerns about data exposure to foreign governments through their authority over cloud providers incorporated in their territories. Key characteristics include data residency guarantees ensuring data never leaves specified territories, operational sovereignty with local staff and management not subject to foreign authority, legal immunity from foreign data access requests, separation from global provider infrastructure, and compliance with national security requirements and certifications. Implementations range from dedicated sovereign cloud regions operated by US hyperscalers within specific countries — Microsoft Cloud for Sovereignty, Google Sovereign Cloud operated by local partners — to fully indigenous cloud providers including OVHcloud, Deutsche Telekom Delos Cloud, and Numspot. Government agencies, defense contractors, critical infrastructure operators, and financial services firms increasingly require sovereign cloud for sensitive workloads. Selection criteria include provider nationality and ownership structure, operational model and staff location, national certifications achieved (SecNumCloud, EUCS, BSI C5), and contractual protections against foreign law exposure.", technologies: ["OVHcloud", "T-Systems", "Numspot", "Delos Cloud"] },
            { name: "Space Cybersecurity", category: "protect", maturity: "emerging", description: "Space cybersecurity - Satellite, ground segment and link protection", longDescription: "Space cybersecurity covers the protection of satellites, ground control infrastructure, and the communication links between them, an area of rising concern as economic and military dependence on space-based positioning, timing, communications, and observation has become systemic while much of the installed base was designed without adversarial threat models. The attack surface spans three segments. The space segment comprises the spacecraft itself, where constrained processors, long design lifetimes measured in decades, and the practical impossibility of physical intervention make firmware integrity and secure update capability decisive. The ground segment covers control centres, antenna sites, and increasingly cloud-hosted mission operations, which represent the most accessible path since compromising a control system can yield command authority over a spacecraft. The link segment covers command, telemetry, and payload data transmission, exposed to jamming, spoofing, and replay, with the disruption of satellite communications terminals during recent conflict demonstrating the operational consequences. Timing and positioning dependency creates broad indirect exposure, since interference with satellite navigation signals affects aviation, maritime navigation, telecommunications synchronization, and financial transaction timestamping far from any space operator. Emerging governance treats space as critical infrastructure, with sector-specific frameworks, supply chain assurance for spacecraft components, and post-quantum migration planning that is unusually urgent given mission lifetimes exceeding the expected arrival of quantum capability.", technologies: ["Thales Alenia Space", "Airbus Defence and Space", "CCSDS", "Space ISAC"] },
            { name: "SSE (Security Service Edge)", category: "protect", maturity: "mature", description: "Security service edge - Cloud-delivered security without the WAN", longDescription: "Security Service Edge is the security half of the SASE architecture, delivering secure web gateway, cloud access security broker, zero trust network access, firewall as a service, and data protection from a cloud platform without the software-defined WAN networking components. This separation matters commercially and operationally, since many organizations already have satisfactory connectivity from an incumbent network provider and want to modernize security enforcement independently rather than committing to a single vendor for both layers. SSE consolidates functions historically delivered by separate appliances and agents behind one policy engine, one client, and one identity-aware decision point, so a rule expressed in terms of user, device posture, destination application, and data classification applies uniformly across web browsing, SaaS access, and private application connectivity. Consolidation reduces the policy drift and coverage gaps that arise when equivalent rules must be maintained across a web proxy, a VPN, and a CASB. Practical evaluation criteria include inspection performance for encrypted traffic, breadth and quality of data loss prevention, private application connectivity models, point of presence footprint against user and regulatory geography, and the maturity of the unified log and API surface. Most enterprises reach SASE incrementally by deploying SSE first and converging networking later.", technologies: ["Zscaler", "Netskope", "Cloudflare One", "Skyhigh Security"] },
            { name: "SSPM (SaaS Security Posture Management)", category: "identify", maturity: "trending", description: "SaaS security posture - Configuration and integration risk in SaaS", longDescription: "SaaS Security Posture Management assesses the security configuration of business applications such as Microsoft 365, Salesforce, Workday, ServiceNow, Google Workspace, and Slack, addressing a gap where the provider secures the platform while the customer remains responsible for tenant settings that determine actual exposure. Every significant SaaS platform contains hundreds of security-relevant options governing external sharing, guest access, multi-factor enforcement, session policy, audit log retention, data export, and administrative delegation, configured by business administrators rather than security teams and drifting continuously as vendors ship new features enabled by default. SSPM tools connect through vendor APIs, benchmark configuration against best practice and regulatory requirements, and track drift over time. A critical capability is discovery of third-party application integrations, where users grant OAuth tokens allowing external applications persistent access to corporate mail, files, and calendars, creating a supply chain the organization never reviewed and which survives password changes. Additional coverage includes privileged administrator inventory across tenants, dormant and orphaned accounts, over-permissioned roles, publicly shared documents, and detection of anomalous administrative activity. Because SaaS now holds the majority of enterprise data while sitting outside network-based controls, SSPM has become the practical enforcement point for data governance in platforms the organization does not operate.", technologies: ["AppOmni", "Obsidian Security", "Valence Security", "Adaptive Shield"] },
            { name: "Stress test incl. 3rd party", category: "recover", maturity: "mature", description: "Stress testing - Verification with third parties", technologies: ["Gremlin", "Chaos Mesh", "Locust", "JMeter"] },
            { name: "Supply chain resilience", category: "recover", maturity: "trending", description: "Supply chain resilience - Vendor continuity", technologies: ["SAP Ariba", "Coupa", "Tradeshift", "Resilinc"] },
            { name: "Supply chain security", category: "protect", maturity: "trending", description: "Supply chain security - Protection of software dependencies", longDescription: "Supply chain security addresses risks from software dependencies, third-party components, and external code incorporated into applications. Modern applications depend on hundreds of open-source libraries and commercial components that may contain vulnerabilities or malicious code. Organizations must maintain software bill of materials (SBOM), scan dependencies for known vulnerabilities, monitor for newly disclosed vulnerabilities, verify component integrity, assess dependency licenses, and establish processes for rapid response to supply chain incidents. Recent supply chain attacks highlight criticality of securing the software supply chain as foundational security practice.", technologies: ["Snyk", "BlackDuck", "Sonatype Nexus", "Checkmarx", "WhiteSource"] },
            { name: "Sustainability in cyber", category: "govern", maturity: "emerging", description: "Sustainability in cybersecurity - Sustainable security approach", technologies: ["Deloitte", "Accenture", "Capgemini", "KPMG"] },
            { name: "SWG (Secure Web Gateway)", category: "protect", maturity: "mature", description: "Secure web gateway - Inspection and control of outbound web traffic", longDescription: "A Secure Web Gateway inspects outbound internet traffic to enforce acceptable use policy and block web-borne threats, functioning as the control point for user browsing and application access. Core capabilities include URL filtering by category and reputation, TLS decryption and inspection since virtually all traffic and malware delivery is now encrypted, malware scanning with sandbox detonation of downloads, command and control detection blocking beaconing from compromised endpoints, and data loss prevention on uploads to web destinations. Advanced deployments add remote browser isolation, executing risky or uncategorized sites in a disposable remote container and streaming only rendered output so no active content reaches the endpoint, which neutralizes browser exploitation and credential harvesting at the cost of latency and bandwidth. Cloud-delivered gateways have largely displaced on-premises proxy appliances, following users regardless of location through endpoint agents or DNS steering rather than requiring traffic to return to a corporate egress point. Operational challenges centre on TLS inspection, which conflicts with certificate pinning in many applications, requires careful exemption lists for privacy-sensitive categories such as banking and healthcare, and raises works council or regulatory questions about employee monitoring. Within SSE and SASE platforms the gateway supplies the web enforcement plane alongside CASB and ZTNA.", technologies: ["Zscaler Internet Access", "Menlo Security", "Forcepoint ONE", "Cisco Umbrella"] },
            { name: "Synthetic data & anonymization", category: "govern", maturity: "emerging", description: "Synthetic data and anonymization - Sensitive data protection", technologies: ["Mostly AI", "Tonic.ai", "Gretel", "BigID"] },
            { name: "Talent Mgt. (Attract & retain talents)", category: "govern", maturity: "mature", description: "Talent management - Cybersecurity skills acquisition and retention", longDescription: "Cybersecurity talent management addresses the critical shortage of security professionals through strategic recruitment, competitive compensation, professional development, career pathing, and retention programs. Organizations compete intensely for limited security talent, requiring creative approaches including remote work, flexible schedules, continuous learning opportunities, mentorship programs, and opportunities to work with cutting-edge technologies. Retention strategies include competitive compensation, recognition programs, work-life balance, clear career progression, and building positive team culture. As cybersecurity threats intensify while talent remains scarce, effective talent management has become strategic imperative.", technologies: ["LinkedIn Learning", "Pluralsight", "CyberDefenders", "Immersive Labs"] },
            { name: "Tech debt mgt.", category: "protect", maturity: "trending", description: "Technical debt management - Technical debt reduction", technologies: ["SonarQube", "Veracode", "Checkmarx", "Fortify"] },
            { name: "Technological Independence", category: "govern", maturity: "trending", description: "Technological independence - Reducing strategic dependence on foreign technology", longDescription: "Technological independence refers to an organization's or nation's ability to develop, deploy, and maintain critical technology capabilities without excessive reliance on foreign suppliers, reducing exposure to geopolitical risks, supply chain disruptions, export controls, and foreign legal jurisdictions. The strategic dimension encompasses investment in domestic technology development, preference for open standards and open-source solutions enabling modification without vendor permission, diversification across technology providers from multiple geographies, and regulatory frameworks encouraging domestic technology adoption for critical functions. Organizations assess technological independence through vendor concentration risk analysis, technology provenance reviews assessing supplier nationality, open-source versus proprietary technology balancing, and strategic technology roadmaps prioritizing sovereignty for critical systems. Practical measures include adopting open-source software reducing dependency on proprietary vendors, building internal engineering capabilities, preferring multi-cloud and multi-vendor architectures, participating in collaborative technology initiatives like GAIA-X, and maintaining contingency plans for technology disruptions from geopolitical events. The EU's digital sovereignty agenda actively promotes technological independence through the GAIA-X initiative, EU Chips Act funding domestic semiconductor production, Horizon Europe research funding, and procurement policies preferring European technology alternatives for critical infrastructure and government systems.", technologies: ["Nextcloud", "GAIA-X", "Sovereign Cloud Stack", "Linux Foundation"] },
            { name: "Third Party Access Management (Third PartyNAM)", category: "protect", maturity: "trending", description: "Third-party access management - Secure external partner access", longDescription: "Third-Party Access Management securely manages external partner, vendor, and contractor access to organizational resources while maintaining security controls and audit trails. Organizations must provide third parties access for support, collaboration, and service delivery while preventing unauthorized access and maintaining visibility. Solutions provide partner onboarding workflows, time-limited access, least privilege principles, session monitoring, access reviews, and automated deprovisioning. Effective third-party access management balances business needs for partner collaboration with security requirements for protecting sensitive systems and data.", technologies: ["Okta B2B", "Auth0", "Ping CIAM", "CyberArk"] },
            { name: "Threat Hunting", category: "detect", maturity: "mature", description: "Threat hunting - Proactive hypothesis-driven search for intrusions", longDescription: "Threat hunting is the proactive, hypothesis-driven search for adversary activity that existing detection has failed to surface, operating on the assumption that a sufficiently capable attacker is already present and undetected. It differs fundamentally from alert triage, since hunting begins with a question rather than a notification, and its output is as often a new detection rule or a discovered visibility gap as a confirmed intrusion. Methodology typically starts from a hypothesis grounded in threat intelligence, an ATT&CK technique, or knowledge of the environment, such as whether any process has established persistence through a scheduled task with an unusual parent, or whether service accounts have authenticated interactively. The hunter then queries telemetry, examines outliers, and either refutes the hypothesis or escalates to incident response. Techniques include stack counting to find rare values in large populations, baselining normal behavior to isolate deviations, grouping and clustering related activity, and following intelligence-driven searches for specific adversary tradecraft. Prerequisites are substantive, requiring broad retained telemetry with sufficient history, queryable data at speed, accurate asset and identity context, and analysts with deep systems knowledge, which is why hunting maturity generally follows rather than precedes solid detection engineering. Programs should measure value through detections created, visibility gaps closed, and dwell time reduction rather than by counting hunts performed.", technologies: ["CrowdStrike Falcon OverWatch", "Elastic Security", "Velociraptor", "Microsoft Defender XDR"] },
            { name: "Threat Intelligence Platform", category: "detect", maturity: "mature", description: "Threat intelligence platform - Threat aggregation and analysis", longDescription: "Threat Intelligence Platforms aggregate, normalize, and analyze threat data from multiple sources to provide actionable intelligence for security operations. TIPs collect indicators of compromise, threat actor information, vulnerabilities, and attack patterns from commercial feeds, open-source intelligence, information sharing communities, and internal sources. Platforms enrich alerts with threat context, enable threat hunting, support incident investigations, and feed defensive tools with current threat intelligence. Organizations use TIPs to prioritize threats, understand adversary tactics, improve detection rules, and make informed security decisions based on relevant threat landscape intelligence.", technologies: ["MISP", "ThreatStream", "Recorded Future", "CrowdStrike Intelligence"] },
            { name: "Threat-led risk analysis & pentest", category: "identify", maturity: "mature", description: "Threat-led risk analysis and penetration testing", longDescription: "Threat-led penetration testing and risk analysis prioritize security assessments based on actual threat intelligence and likely attack scenarios targeting the organization. Rather than generic security testing, threat-led approaches focus on techniques used by relevant threat actors, target high-value assets, simulate realistic attack chains, and test defenses against organization-specific threats. This approach provides more relevant security insights, validates controls against actual threats, identifies realistic attack paths, and enables risk-based security investments. Organizations use threat intelligence to inform testing scope, ensure assessments address real-world risks, and validate security controls effectiveness against relevant threats.", technologies: ["Burp Suite Pro", "Metasploit", "Nessus", "OpenVAS", "Tenable"] },
            { name: "TOM IAM (Target Operating Model)", category: "protect", maturity: "mature", description: "IAM target operating model - IAM architecture and governance", technologies: ["SailPoint", "Okta", "Ping Identity", "One Identity"] },
            { name: "Unified compliance strategy & framework", category: "govern", maturity: "mature", description: "Unified compliance strategy - Integrated approach", technologies: ["OneTrust", "Workiva", "Archer GRC", "AuditBoard"] },
            { name: "Unified customer privacy rights", category: "govern", maturity: "emerging", description: "Unified customer privacy rights - Privacy rights harmonization", technologies: ["OneTrust", "TrustArc", "BigID", "Crunch"] },
            { name: "Unified security by design (cloud/IT/OT/AI)", category: "govern", maturity: "trending", description: "Unified security by design - Integrated security architecture", technologies: ["Fortinet Security Fabric", "Palo Alto Prisma", "Cisco SecureX", "VMware"] },
            { name: "Universal ZTNA (IT/OT/IoT)", category: "protect", maturity: "emerging", description: "Universal ZTNA - Zero trust access extended to OT and IoT assets", longDescription: "Universal Zero Trust Network Access extends identity-based, least privilege access enforcement beyond managed user endpoints to the full asset population including operational technology, industrial control systems, medical devices, building management systems, and unmanaged IoT equipment. Conventional ZTNA assumes a client agent on a device with a user identity, an assumption that fails for programmable logic controllers, sensors, cameras, and legacy machinery that cannot host software, authenticate a user, or tolerate active scanning. Universal ZTNA addresses this through agentless enforcement at the network layer, using passive fingerprinting and protocol-aware discovery to classify devices, assigning identity based on device attributes and observed behavior rather than credentials, and applying microsegmentation policy at switch, wireless, or gateway level so each asset communicates only with the specific peers its function requires. Remote maintenance access for vendors and integrators becomes brokered and session-recorded rather than delivered through flat VPN tunnels or jump hosts, addressing a longstanding path for lateral movement into production environments. Continuous posture assessment revokes access when a device begins behaving anomalously. Drivers include the convergence of IT and OT networks, regulatory pressure from NIS2 and IEC 62443 on critical infrastructure segmentation, and the practical impossibility of patching much of the installed industrial base.", technologies: ["Fortinet Universal ZTNA", "Claroty xDome Secure Access", "Cisco Secure Equipment Access", "Xage Security"] },
            { name: "Unstructured data access", category: "protect", maturity: "mature", description: "Unstructured data access - File/data access control", technologies: ["BigID", "Varonis", "IBM Security", "Imperva"] },
            { name: "VEX (Vulnerability Exploitability eXchange)", category: "identify", maturity: "trending", description: "VEX - Machine-readable statements on vulnerability applicability", longDescription: "Vulnerability Exploitability eXchange is a machine-readable format for asserting whether a specific product is actually affected by a known vulnerability, addressing the signal-to-noise problem that software bills of materials created. Once an SBOM reveals every dependency, automated matching against vulnerability databases produces enormous volumes of findings, the large majority of which are not exploitable in context because the vulnerable function is never called, the affected component is not built into the shipped artifact, the vulnerable code path is unreachable given configuration, or a mitigation already prevents exploitation. Without a way to communicate this, suppliers are overwhelmed by customer enquiries about irrelevant findings and customers waste remediation capacity on non-issues. A VEX document conveys, for a given product and vulnerability, one of a small set of status assertions, namely not affected with a stated justification, affected, fixed, or under investigation, allowing consumers to filter automatically and concentrate on genuine exposure. Standardized profiles exist within CycloneDX, CSAF, and OpenVEX, enabling generation and consumption through existing tooling. The critical dependency is supplier participation, since only the vendor can authoritatively state that a vulnerable component is unreachable in their product, which is why VEX provision is increasingly written into procurement requirements alongside SBOM delivery and is anticipated in regulatory vulnerability handling obligations such as those in the EU Cyber Resilience Act.", technologies: ["OpenVEX", "CycloneDX", "CSAF", "Anchore"] },
            { name: "Workforce resilience", category: "govern", maturity: "trending", description: "Workforce resilience - Personnel availability and continuity", technologies: ["LinkedIn Learning", "Skillsoft", "Coursera", "edX"] },
            { name: "Workload Identity Federation (SPIFFE)", category: "protect", maturity: "trending", description: "Workload identity - Cryptographic service identity without secrets", longDescription: "Workload identity federation replaces long-lived secrets in service-to-service authentication with short-lived, cryptographically attested identities issued to workloads based on verifiable properties of their runtime environment. The problem it solves is pervasive, since microservices, CI pipelines, and cross-cloud integrations traditionally authenticate with static API keys and credentials that are copied into configuration, committed to repositories, shared across environments, rarely rotated, and represent the most commonly exploited class of exposed secret. The SPIFFE standard defines a universal identity document, the SVID, delivered as an X.509 certificate or JWT carrying a structured identity name, issued by a local agent that attests the workload through platform signals such as Kubernetes service account, node identity, or process attributes before granting credentials with lifetimes measured in minutes. Services then authenticate to each other with mutual TLS using these identities, and authorization policy is expressed against workload identity rather than network address, which remains valid as workloads move and scale. Cloud provider workload identity federation applies the same principle to external systems, letting a pipeline exchange its platform-issued token for cloud access without any stored key. Adoption reduces secret sprawl, shortens the exploitable window of any leak, and produces cryptographic audit evidence of which workload performed which action.", technologies: ["SPIFFE/SPIRE", "HashiCorp Vault", "Istio", "GitHub OIDC"] },
            { name: "WORM/Airgap storage & backup (Immutable backups)", category: "recover", maturity: "mature", description: "Immutable storage and isolated backup - Ransomware protection", technologies: ["Veeam Immutable", "Commvault", "Veritas", "IBM Spectrum"] },
            { name: "XDR (Extended Detection and Response)", category: "detect", maturity: "trending", description: "Extended detection and response - Multi-layer correlation", longDescription: "Extended Detection and Response integrates security data and response capabilities across endpoints, networks, cloud, email, and identity systems into unified platforms providing coordinated threat detection and response. Unlike siloed security tools generating separate alerts, XDR correlates events across security layers to identify complex attack patterns, reduce false positives through context, and enable coordinated response actions. Platforms collect telemetry from multiple sources, apply analytics detecting threats across the attack chain, provide unified investigation interfaces, and orchestrate response across security tools. Organizations benefit from improved threat detection through correlation, faster investigations with centralized visibility, reduced alert fatigue, and automated cross-layer response. XDR represents evolution toward integrated security operations platforms that break down tool silos.", technologies: ["CrowdStrike XDR", "Microsoft Defender XDR", "Palo Alto Cortex XDR", "Sophos XDR"] },
            { name: "Zero Standing Privilege (ZSP)", category: "protect", maturity: "trending", description: "Zero standing privilege - Just-in-time privileged access", technologies: ["CyberArk PAM", "BeyondTrust", "Delinea", "HashiCorp"] },
            { name: "Zero trust enabled app.", category: "protect", maturity: "trending", description: "Zero trust enabled applications - Zero trust model implementation", longDescription: "Zero Trust enabled applications implement security architectures that verify every access request regardless of source, assuming no implicit trust based on network location. Applications enforce fine-grained access controls, continuously validate user and device trust, implement least privilege access, encrypt data, maintain detailed audit logs, and integrate with identity providers for authentication and authorization decisions. This approach moves security from network perimeter to application and data level, enabling secure access from any location while maintaining strong security. Organizations building zero trust applications must implement identity-aware proxies, API-level authorization, continuous authentication, microsegmentation, and comprehensive logging. As remote work proliferates and perimeters dissolve, zero trust application architectures provide security models suited for modern distributed environments.", technologies: ["Okta", "Google Zero Trust", "Microsoft Entra", "CyberArk"] },
            { name: "Zero trust metrics", category: "protect", maturity: "mature", description: "Zero trust metrics - Zero trust implementation KPIs", technologies: ["Splunk", "Datadog", "New Relic", "Dynatrace"] },
            { name: "ZTNA (Zero Trust Network Access)", category: "protect", maturity: "mature", description: "Zero trust network access - Application-level access replacing VPN", longDescription: "Zero Trust Network Access provides authenticated, per-application access to private resources without granting network-level connectivity, replacing the VPN model in which a successful connection places the client on an internal network with broad reachability. A ZTNA broker authenticates the user, evaluates device posture, and establishes an application-specific tunnel through an outbound connector deployed beside the workload, so applications are never exposed to inbound internet connections and remain invisible to unauthorized users and scanners. Access decisions incorporate identity, group membership, device compliance, location, and risk signals, and are re-evaluated continuously rather than only at session establishment, allowing revocation mid-session when posture degrades. Compared with VPN, ZTNA collapses the lateral movement surface that attackers exploit after credential compromise, since a stolen session grants access only to explicitly authorized applications rather than an entire subnet. Additional benefits include eliminating internet-facing VPN concentrators that have repeatedly been targeted through critical vulnerabilities, simplified third-party and contractor access without device management, and cleaner accommodation of mergers where overlapping address space complicates network routing. Implementation challenges include handling non-web protocols and legacy thick clients, discovering the full private application inventory, server-initiated flows such as voice and device management, and sequencing VPN decommissioning without disrupting operations.", technologies: ["Zscaler Private Access", "Cloudflare Access", "Twingate", "Tailscale"] }
        ];

        let currentCategory = 'all';
        let currentMaturity = 'all';
        let currentSearch = '';

        function init() {
            displayTerms();
            updateStats();
            setupSearchListener();
        }

        function setupSearchListener() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearch = e.target.value.toLowerCase();
                displayTerms();
            });
        }

        // Helper function to create clickable technology links
        function createTechLink(techName) {
            const url = technologyUrls[techName];
            if (url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit;">${techName}</a>`;
            }
            return techName;
        }

        function displayTerms() {
            const container = document.getElementById('termsContainer');
            container.innerHTML = '';

            let filtered = terms.filter(term => {
                const matchesCategory = currentCategory === 'all' || term.category === currentCategory;
                const matchesMaturity = currentMaturity === 'all' || term.maturity === currentMaturity;
                const matchesSearch = term.name.toLowerCase().includes(currentSearch) || 
                                    term.description.toLowerCase().includes(currentSearch) ||
                                    term.technologies.some(t => t.toLowerCase().includes(currentSearch));
                return matchesCategory && matchesMaturity && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">No terms match your search...</div>';
                document.getElementById('displayedTerms').textContent = '0';
                return;
            }

            filtered.forEach(term => {
                const card = document.createElement('div');
                card.className = `term-card ${term.category}`;
                
                const maturityBadges = {
                    'emerging': '🚀 Emerging',
                    'trending': '📈 Trending',
                    'mature': '✅ Mature'
                };
                
                card.innerHTML = `
                    <div class="term-badges">
                        <span class="term-badge ${term.maturity}">${maturityBadges[term.maturity]}</span>
                    </div>
                    <span class="term-category ${term.category}">${getCategoryLabel(term.category)}</span>
                    <div class="term-name">${term.name}</div>
                    <div class="term-description">${term.description}</div>
                    <div class="term-tech">
                        <div class="tech-label">Examples:</div>
                        <div class="tech-list">
                            ${term.technologies.slice(0, 2).map(tech => `<span class="tech-badge">${createTechLink(tech)}</span>`).join('')}
                        </div>
                    </div>
                `;
                card.onclick = () => showDetail(term);
                container.appendChild(card);
            });

            document.getElementById('displayedTerms').textContent = filtered.length;
        }

        function filterCategory(category, event) {
            currentCategory = category;
            currentSearch = '';
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn === event.target) btn.classList.add('active');
                else if (!btn.textContent.includes('🚀') && !btn.textContent.includes('📈') && !btn.textContent.includes('✅')) {
                    btn.classList.remove('active');
                }
            });
            event.target.classList.add('active');
            
            displayTerms();
        }

        function filterMaturity(maturity, event) {
            currentMaturity = maturity;
            currentSearch = '';
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn === event.target) btn.classList.add('active');
                else if (btn.textContent.includes('🚀') || btn.textContent.includes('📈') || btn.textContent.includes('✅')) {
                    btn.classList.remove('active');
                }
            });
            event.target.classList.add('active');
            
            displayTerms();
        }

        function getCategoryLabel(category) {
            const labels = {
                'govern': 'Govern',
                'identify': 'Identify',
                'protect': 'Protect',
                'detect': 'Detect',
                'respond': 'Respond',
                'recover': 'Recover'
            };
            return labels[category] || category;
        }

        function showDetail(term) {
            const panel = document.getElementById('detailPanel');
            const content = document.getElementById('detailContent');
            
            const maturityLabel = {
                'emerging': '🚀 Emerging',
                'trending': '📈 Trending',
                'mature': '✅ Mature'
            };
            
            content.innerHTML = `
                <h2 style="color: #667eea; margin-bottom: 15px;">${term.name}</h2>
                <div class="detail-badges">
                    <span class="term-category ${term.category}" style="display: inline-block; margin-right: 8px;">${getCategoryLabel(term.category)}</span>
                    <span class="term-badge ${term.maturity}">${maturityLabel[term.maturity]}</span>
                </div>
                
                <div class="detail-section" style="margin-top: 20px;">
                    <h3>📝 Description</h3>
                    <p style="line-height: 1.8; color: #555;">${term.longDescription || term.description}</p>
                </div>

                <div class="detail-section">
                    <h3>💻 Technologies & Solutions (${term.technologies.length})</h3>
                    <div class="tech-list-detail">
                        ${term.technologies.map(tech => `<span class="tech-badge-detail">${createTechLink(tech)}</span>`).join('')}
                    </div>
                </div>

                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
                    <p style="color: #999; font-size: 0.9em;">Term from the Cybersecurity Glossary</p>
                    <p style="color: #999; font-size: 0.85em; margin-top: 8px;">Maturity: <strong>${maturityLabel[term.maturity]}</strong></p>
                </div>
            `;
            
            panel.classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('active');
        }

        function resetSearch() {
            currentSearch = '';
            currentCategory = 'all';
            currentMaturity = 'all';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.filter-btn').classList.add('active');
            displayTerms();
        }

        function updateStats() {
            document.getElementById('totalTerms').textContent = terms.length;
            document.getElementById('categoriesCount').textContent = new Set(terms.map(t => t.category)).size;
        }

        // Initialize app
        init();
    </script>

    <footer>
